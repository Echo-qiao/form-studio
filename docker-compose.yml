# 一条命令起全套：后端 API + 前端 Nginx
#
# 首次：
#   copy .env.example .env
#   docker compose up -d --build
#
# 访问：http://localhost:8090        前端
#       http://localhost:4200/health 后端直连

services:
  api:
    build:
      context: ./server
    container_name: fd-api
    restart: unless-stopped
    environment:
      # SQLite 文件放在卷里，容器重建数据不丢
      DATABASE_URL: file:/data/dev.db
      JWT_SECRET: ${JWT_SECRET:?请在根目录 .env 里设置 JWT_SECRET}
      PORT: "4200"
      TZ: Asia/Shanghai
      # 首次启动时写入演示账号和演示表单；已有数据会自动跳过
      SEED_ON_START: ${SEED_ON_START:-1}
    volumes:
      - sqlite_data:/data
    ports:
      - "4200:4200"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:4200/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s

  web:
    build:
      context: ./client
    container_name: fd-web
    restart: unless-stopped
    ports:
      # 主项目占了 8080，这里用 8090
      - "8090:80"
    depends_on:
      api:
        # 等后端真的能响应再起 Nginx，否则首屏就是 502
        condition: service_healthy

volumes:
  sqlite_data: